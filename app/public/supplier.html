<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>買掛管理 | 仕入先マスター</title><link rel="stylesheet" href="/style.css"><style>body.embedded>header,body.embedded .shell>aside{display:none!important}body.embedded .shell{min-height:100vh}body.embedded .shell>main{padding:12px!important}</style><script>if(new URLSearchParams(location.search).has('embedded'))document.addEventListener('DOMContentLoaded',()=>document.body.classList.add('embedded'));</script></head><body><header><a href="/" style="color:inherit;text-decoration:none"><strong>← 買掛・決済管理</strong></a><span>ローカルアプリ v0.1.2</span></header><div class="shell"><aside><div class="muted">メニュー</div><nav><div>ダッシュボード <small>準備中</small></div><div>仕入登録 <small>準備中</small></div><div>INVOICE管理 <small>準備中</small></div><div>決済・充当 <small>準備中</small></div><div>送金一覧 <small>準備中</small></div><div class="selected">仕入先マスター</div><div>設定・バックアップ <small>準備中</small></div></nav></aside><main><div class="heading"><div><h1>仕入先マスター</h1><p>仕入先情報を登録・編集します。保存したデータはSQLiteに記録されます。</p></div><button id="new" class="primary">＋ 新規登録</button></div><div class="content"><section class="listpanel"><label for="search">仕入先を検索</label><input id="search" placeholder="コード・仕入先名"><div class="listhead"><span>仕入先一覧</span><span id="count"></span></div><div id="list" class="supplierlist"></div></section><section class="editor"><div class="editorhead"><h2 id="editorTitle">新規登録</h2><span id="message" role="status"></span></div><form id="form"><div class="fields"><label class="short">仕入先コード <b>*</b><input name="code" maxlength="4" required placeholder="例：001"></label><label class="wide">仕入先名 <b>*</b><input name="name" maxlength="256" required></label><label class="wide">支払先<div class="inputline"><input name="payee_name" maxlength="256"><button type="button" id="copySupplier">仕入先名と同じ</button></div></label><label class="short">支払通貨<select name="currency"><option value="">未設定</option><option value="JPY">JPY（円）</option><option value="USD">USD（米ドル）</option><option value="EUR">EUR（ユーロ）</option><option value="CNY">CNY（人民元）</option><option value="GBP">GBP（英ポンド）</option><option value="TWD">TWD（台湾ドル）</option><option value="KRW">KRW（韓国ウォン）</option></select></label><label class="medium">受取人コード<input name="bank_beneficiary_code" maxlength="256" placeholder="銀行登録の受取人コード"></label><div class="countryrow"><label>仕入先国<input name="supplier_country" maxlength="256"></label><label>原産国<input name="origin_country" maxlength="256"></label><label>船積地<input name="shipping_port" maxlength="256"></label></div><label class="wide">主な取引内容<input name="main_business" maxlength="256"></label><label class="medium">決済区分<select name="default_settlement_method"><option value="transfer">通常送金</option><option value="advance">前払</option><option value="offset">相殺</option></select></label><label class="medium">使用<div class="toggleline"><input id="activeToggle" type="checkbox" role="switch" checked><span id="activeText">使用する</span></div><input type="hidden" name="is_active" value="1"></label><label class="wide">支払条件<div class="inputline"><input name="payment_terms" maxlength="256" placeholder="例：月末締め・翌々月10日払い"><button type="button" id="defaultTerms">規定を適用</button></div></label><label class="wide">INVOICE番号テンプレート<input name="invoice_number_template" maxlength="256" placeholder="例：ZKW-A-{yymm}MK01"><div class="tokenrow"><button type="button" data-token="{yymm}">{yymm} を挿入</button><button type="button" data-token="{yyyymm}">{yyyymm} を挿入</button></div></label><label class="wide">送金メッセージ形式<select name="message_format"><option value="number">INVOICE番号のみ</option><option value="amount">INVOICE番号(金額)</option></select></label><label class="wide">先頭固定文字<input name="message_prefix" maxlength="256"></label><label class="wide">区切り文字<input name="message_separator" maxlength="256" value=" "></label><label class="wide">末尾固定文字<input name="message_suffix" maxlength="256"></label></div><div class="actions"><button type="button" id="discard">編集内容を破棄</button><button class="primary" type="submit" id="save">保存する</button></div></form></section></div></main></div><script src="/supplier.js"></script></body></html>
